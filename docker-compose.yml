services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: provnet
      POSTGRES_PASSWORD: provnet
      POSTGRES_DB: provnet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provnet"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
