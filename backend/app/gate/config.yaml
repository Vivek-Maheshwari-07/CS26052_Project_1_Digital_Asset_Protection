version: "1.3.0"
modes:
  tier1: "active"
  related: "active"
  tier2: "shadow"
  tier3: "shadow"
  ml_detector: "shadow"
  c2pa: "active"
  watermark: "stub"

# UNCALIBRATED STARTING VALUES (eval/gate_eval.py --sweep fits them from labelled data)

# --- G1 retrieval
k_candidates: 3             # measured: the true work is in the top 3 of either index for 100% of 639 positives (top 1: 98.4%)
index_crops: true            # also index 5 DINOv2 crop vectors per work (4 quadrants + centre) so small crops are found
max_parallel_candidates: 4   # candidates verified concurrently
descriptor_cache_size: 64    # target SIFT descriptor sets kept in memory

# --- G2 geometric verification
sift_nfeatures: 4000
working_long_side: 1024
ratio_test: 0.70
ransac_reproj_px: 5.0
min_inliers: 30
min_spread_cells: 6
min_inlier_coverage: 0.15    # both images, as a bounding-box share of the frame
containment_coverage: 0.4    # ...or: one image is (mostly) contained in the other (a crop / an embedded copy);
                             # 0.4 not 0.5: failing 10% crops had 0.42-0.49 and no negative ever failed this test
containment_min_coverage: 0.02   # the contained side's inliers span >= this much of the larger image
reproj_tight_px: 2.0         # repeated-pattern guard: inliers must reproject this tightly...
min_tight_inlier_frac: 0.5   # ...for at least this fraction
# images with few keypoints (flat art, logos) get relaxed counts but a stricter fit
low_feature_kps: 400
low_feature_min_inliers: 12
low_feature_min_spread_cells: 3
low_feature_min_tight_frac: 0.8

# whole-image ECC alignment for flat art SIFT cannot handle; runs only for a strong retrieval lead
ecc_fallback: true
ecc_fallback_min_dino: 0.6
ecc_fallback_min_cc: 0.9
ecc_fallback_max_aspect_diff: 0.06

# --- G3 dense evidence (measured on informative pixels only: flat backgrounds say nothing)
ecc_downscale: 0.5
info_grad_min: 8.0           # Sobel magnitude that makes a pixel "informative"
min_info_frac: 0.02          # fewer informative pixels than this (or min_info_pixels) => low_information, no pixel evidence
min_info_pixels: 1500
change_threshold: 40         # gray-level residual that counts as a changed pixel

# --- G4 classification
tier1_residual_p90_max: 20.0
tier1_residual_median_max: 4.0       # route A: was 8; a typical copy is 0-3, separate near-identical captures were 5+
tier1_changed_frac_max: 0.15
tier1_hp_ncc_min: 0.1        # copies share fine detail (high-pass correlation); separate captures of a scene do not
# route B: a looser 90th-percentile residual (edge pixels of flat art, JPEG ringing, resampling) is accepted
# only when the match is otherwise near-exact. Chosen on the dev split, confirmed once on the test split.
tier1b_residual_p90_max: 45.0
tier1b_residual_median_max: 3.0
tier1b_flow_median_max_px: 1.0
tier1b_changed_frac_max: 0.05
tier1b_hp_ncc_min: 0.5       # only applied where fine-detail correlation could be measured
tier1_flow_median_max_px: 3.0
tier2_flow_median_max_px: 10.0
tier2_edge_corr_min: 0.3
tier3_lead_score_min: 0.85
tier3_margin_min: 0.05

# --- G0 / G5
evidence_max_side: 1600
uniform_std_max: 2.0
uniform_light_min: 240.0
uniform_dark_max: 15.0
